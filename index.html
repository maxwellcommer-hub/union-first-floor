<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The First Floor · Kansas Union Level 1</title>
<meta name="description" content="Team 3’s plan for Level 1 of the Kansas Union: the Hawk’s Nest, The Jay and The Cove. Walk the floor plan space by space, with every before and after.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0067B1">
<meta property="og:title" content="The First Floor · Kansas Union Level 1">
<meta property="og:description" content="Walk the floor plan space by space, with every before and after.">
<meta property="og:image" content="assets/spaces/10/after.webp">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=202611021432">
</head>
<body>
<header class="bar">
  <a class="mark" href="#/" aria-label="The First Floor, home">
    <span class="mark-place">Kansas Union · Level 1</span>
    <span class="mark-title">The First Floor</span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="map">The map</a>
    <a href="#/story" data-tab="story">Our thinking</a>
    <a href="#/survey" data-tab="survey">Survey</a>
  </nav>
  <div class="bar-meta"><span id="metaTeam"></span><span id="metaDate"></span></div>
</header>

<main id="mapView" class="map-view">
  <div class="viewport" id="viewport" aria-label="Level 1 floor plan">
    <div class="world" id="world">
      <img class="layer" data-layer="plan" alt="">
      <img class="layer" data-layer="zones" alt="">
      <img class="layer" data-layer="heat" alt="">
      <svg class="cones" id="cones" aria-hidden="true"></svg>
    </div>
    <div class="marks" id="marks"></div>
  </div>

  <div class="map-ui">
    <div class="layers" role="radiogroup" aria-label="Map layer">
      <button role="radio" data-layer="plan" aria-checked="true">Plan</button>
      <button role="radio" data-layer="zones" aria-checked="false">Nine zones</button>
      <button role="radio" data-layer="heat" aria-checked="false">Loud to quiet</button>
    </div>
    <div class="heat-key" aria-hidden="true"><span>Loudest</span><i></i><span>Calmest</span></div>
    <div class="zoom">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">&minus;</button>
      <button id="zoomFit" aria-label="Fit the whole floor">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </div>

  <aside class="sheet" id="sheet" aria-live="polite">
    <button class="grip" id="grip" aria-label="Expand or collapse the panel"><i></i></button>
    <div class="sheet-scroll" id="sheetScroll"><div id="sheetBody"></div></div>
  </aside>
</main>

<main id="storyView" class="story" hidden></main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-bar"><span id="lbCap"></span><button id="lbClose" aria-label="Close">Close</button></div>
</div>

<script src="data/content.js?v=202611021432"></script>
<script src="data/survey.js?v=202611021432"></script>
<script src="data/assets.js?v=202611021432"></script>
<script src="js/app.js?v=202611021432"></script>
</body>
</html>
